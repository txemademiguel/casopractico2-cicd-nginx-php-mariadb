services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_NAME:-empresa}
      DB_USER: ${DB_USER:-alumno_daw}
      DB_PASSWORD: ${DB_PASSWORD:-password_segura_123}
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-docker123}
      MYSQL_DATABASE: ${DB_NAME:-empresa}
      MYSQL_USER: ${DB_USER:-alumno_daw}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password_segura_123}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
